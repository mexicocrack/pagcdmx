<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PCDMX-MXRP - En desarrollo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Barra superior -->
    <div class="topbar">
      <div class="brand">PCDMX-MXRP</div>

      <div class="timebox">
        <div id="cdmx-time">--:--:--</div>
        <div class="tz">CDMX · America/Mexico_City</div>
      </div>
    </div>

    <!-- Contenedor principal -->
    <main class="card">
      <h2 class="status">En desarrollo</h2>
      <p class="subtext">Trabajando en mejoras. Volveremos pronto.</p>

      <div class="dates">
        <strong>Posible fecha de completación:</strong><br />
        Jueves 20/11/2025 a Lunes 24/11/2025
      </div>
    </main>

    <!-- Moment.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
